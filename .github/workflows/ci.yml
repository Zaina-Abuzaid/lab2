name: Lab 2 CI/CD
permissions:
  contents: read
  packages: write
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx ruff

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Run lint
        run: ruff check src/ tests/
  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Build Docker image
        run: docker build -t lab2-churn:${{ github.sha }} .
      - name: Install Trivy
        run: |
          docker pull aquasec/trivy:0.67.2
          docker create --name trivy-installer aquasec/trivy:0.67.2
          docker cp trivy-installer:/usr/local/bin/trivy ./trivy
          sudo mv ./trivy /usr/local/bin/trivy
          sudo chmod +x /usr/local/bin/trivy
          docker rm trivy-installer

      - name: Scan Docker image
        run: trivy image --exit-code 1 --severity HIGH,CRITICAL lab2-churn:${{ github.sha }}       
      - name: Login to GHCR
        if: github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Tag and push Docker image
        if: github.event_name == 'push'
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${{ github.sha }}
          docker tag lab2-churn:${{ github.sha }} "$IMAGE"
          docker push "$IMAGE"  